<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Additions/styles.css">
    <link rel="icon" type="image/webp" href="/Additions/Media/Zarya-Black.webp" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/webp" href="/Additions/Media/Zarya-White.webp" media="(prefers-color-scheme: dark)">
    <title>Заря - Вход</title>
</head>
<body>
    <div class="LoginAndRegisterField">
        <form method="post" action="/Admin/Login/Send" novalidate>
            <label class="LoginField">
                Логин
                <input name="Login" type="text">
                <div class="loginError" id="loginError" aria-live="polite"></div>
            </label>
            <br>
            <label class="PassField">
                Пароль
                <input name="Password" type="password">
                <div class="PassError" id="PassError" aria-live="polite"></div>
            </label>
            <br>
            <button type="submit">Отправить</button>
        </form>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const error = params.get("error");
        const login = params.get("login");
        const pass = params.get("pass");
        const loginError = document.getElementById("loginError");
        const passError = document.getElementById("PassError");
        const loginInput = document.querySelector('input[name="Login"]');
        const passInput = document.querySelector('input[name="Password"]');

        if (login !== null) {
            loginInput.value = login;
        }

        const showError = (element, input, text) => {
            element.textContent = text;
            element.classList.add("is-visible");
            input.classList.add("is-invalid");
        };

        if (error === "nullLogin") {
            showError(loginError, loginInput, "Логин не вбит");
        } else if (error === "wrongLogin") {
            showError(loginError, loginInput, "Нет такого логина");
        } else if (error === "nullPass") {
            showError(passError, passInput, "Пароль не вбит");
        } else if (error === "wrongPass") {
            showError(passError, passInput, "Неверный пароль");
        }
    </script>
</body>
</html>
